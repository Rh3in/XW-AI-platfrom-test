  <body>

              <path d="M8 12h3M13 12h3M8 16h3" />

          <a href="#" class="rail-item has-badge">
            <svg viewBox="0 0 24 24" aria-hidden="true">

              <path d="M9.5 18a2.6 2.6 0 0 0 5 0" />

            <b>4</b>

          <a href="#" class="rail-item">

              <path d="M8 5h9a2 2 0 0 1 2 2v12H8a3 3 0 0 1 0-6h11" />
              <path d="M5 7h3v12H5" />
            </svg>
            <span>通讯录</span>
          </a>
          <a href="#" class="rail-item active">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 7.2a4.5 4.5 0 0 0-4.5 4.5v.8A4.5 4.5 0 0 0 9 17h6a4.5 4.5 0 0 0 4.5-4.5v-.8A4.5 4.5 0 0 0 15 7.2" />
              <path d="M8.5 6V4.5M15.5 6V4.5M9 11.5h.1M15 11.5h.1M11 14h2" />
            </svg>
            <span>AI+</span>
          </a>
          <a href="#" class="rail-item">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.5 5.2A3.2 3.2 0 0 1 7.7 4H20v14H7.7a3.2 3.2 0 0 0-3.2 1.2V5.2Z" />
              <path d="M4.5 5.2A3.2 3.2 0 0 0 1.3 4H4.5v15.2" />
              <path d="M8.5 8h7M8.5 11.5H15" />
            </svg>
            <span>知识库</span>
          </a>
        </nav>

        <button class="rail-menu" aria-label="更多菜单">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 7h14M5 12h14M5 17h14" />
          </svg>
        </button>
      </aside>

      <aside class="panel" aria-label="AI+ 历史对话">
        <header class="panel-header">
          <div class="brand">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8.4 8.2V6.5M15.6 8.2V6.5" />
              <rect x="4.5" y="8" width="15" height="10" rx="4" />
              <path d="M9 12.5h.1M15 12.5h.1M10.5 15h3" />
            </svg>
            <span>AI+</span>
          </div>
          <button class="collapse" aria-label="收起侧栏">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="4" width="14" height="16" rx="1.8" />
              <path d="M10 4v16M15 9l-3 3 3 3" />
            </svg>
          </button>
        </header>

        <button class="new-chat" id="newChat">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13 5H6.5A2.5 2.5 0 0 0 4 7.5v10A2.5 2.5 0 0 0 6.5 20h10a2.5 2.5 0 0 0 2.5-2.5V11" />
            <path d="M14 4.5h5.5V10M19 5l-8.5 8.5L9 17l3.5-1.5L21 7" />
          </svg>
          新建对话
        </button>

        <section class="history">
          <header>
            <div>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="8.5" />
                <path d="M12 7.5V12l3 2" />
              </svg>
              <span>历史对话</span>
            </div>
            <a href="#">更多<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg></a>
          </header>
          <div class="history-list" id="historyList">
            <a href="#" class="history-item" data-query="下一年技术部门编制缺口预测">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1.8" /><path d="M7 15l3.2-3.1 2.4 2 4.3-5M4 20h16" /></svg>
              下一年技术部门编制缺口
            </a>
            <a href="#" class="history-item" data-query="2024财务收入报表统计">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1.8" /><path d="M7 15l3.2-3.1 2.4 2 4.3-5M4 20h16" /></svg>
              2024财务收入报表统计
            </a>
            <a href="#" class="history-item" data-query="销售目标完成率预测">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1.8" /><path d="M7 15l3.2-3.1 2.4 2 4.3-5M4 20h16" /></svg>
              销售目标完成率预测
            </a>
            <a href="#" class="history-item" data-query="客户流失风险分层">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1.8" /><path d="M7 15l3.2-3.1 2.4 2 4.3-5M4 20h16" /></svg>
              客户流失风险分层
            </a>
            <a href="#" class="history-item" data-query="库存周转与缺货预警">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1.8" /><path d="M7 15l3.2-3.1 2.4 2 4.3-5M4 20h16" /></svg>
              库存周转与缺货预警
            </a>
            <a href="#" class="history-item" data-query="营销漏斗转化分析">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1.8" /><path d="M7 15l3.2-3.1 2.4 2 4.3-5M4 20h16" /></svg>
              营销漏斗转化分析
            </a>
            <a href="#" class="history-item" data-query="客服工单SLA趋势">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1.8" /><path d="M7 15l3.2-3.1 2.4 2 4.3-5M4 20h16" /></svg>
              客服工单SLA趋势
            </a>
            <a href="#" class="history-item" data-query="预算成本偏差分析">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1.8" /><path d="M7 15l3.2-3.1 2.4 2 4.3-5M4 20h16" /></svg>
              预算成本偏差分析
            </a>
          </div>
        </section>
      </aside>

      <main class="main" id="main">
        <h1>智能数据</h1>

        <section class="greeting" id="greeting" aria-label="欢迎语">
          <div class="mascot">AI</div>
          <div class="greet-bubble">
            <span>Hi~我是智能数据助手！</span>
            <em>很荣幸为您服务</em>
          </div>
        </section>

        <section class="chat-view" id="chatView" aria-live="polite"></section>

        <section class="workspace" id="workspace" aria-label="对话区">
          <div class="search-panel" id="searchPanel" hidden>
            <header>
              <span>相关问题</span>
              <small>选择一个问题开始分析</small>
            </header>
            <div class="search-results" id="searchResults"></div>
          </div>

          <form class="composer" id="composerForm">
            <textarea id="questionInput" aria-label="输入您的问题" placeholder="请输入您的问题"></textarea>
            <div class="composer-footer">
              <div class="mode-group">
                <button type="button" class="pill active-pill">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3.5 13.4 8l4.6-1-3 3.8 3 3.8-4.6-1L12 18l-1.4-4.4-4.6 1 3-3.8-3-3.8 4.6 1L12 3.5Z" />
                  </svg>
                  深度思考
                </button>
                <button type="button" class="pill">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="8" cy="8" r="3" />
                    <circle cx="16" cy="16" r="3" />
                    <path d="M10.4 10.3 13.6 13.7M14.2 8.4 10 14" />
                  </svg>
                  分享管理
                </button>
              </div>
              <div class="action-group">
                <button type="button" class="icon-button" title="添加附件" aria-label="添加附件">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m9.2 13.8 6.7-6.7a3 3 0 0 1 4.2 4.2l-8.2 8.2a5 5 0 0 1-7.1-7.1l8-8" />
                  </svg>
                </button>
                <button type="button" class="icon-button" title="语音输入" aria-label="语音输入">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="9" y="4" width="6" height="10" rx="3" />
                    <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" />
                  </svg>
                </button>
                <button type="submit" class="send" id="sendButton" title="发送" aria-label="发送">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m4 12 16-7-5.5 15-3-6.5L4 12Z" />
                    <path d="m11.5 13.5 3-3" />
                  </svg>
                </button>
              </div>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="./script.js?v=20260727-6"></script>

</html>
