<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能问数</title>
    <link rel="stylesheet" href="./styles.css?v=20260727-bdata-8" />
  </head>
  <body>
    <div class="app">
      <header class="site-header">
        <strong>智能问数</strong>
      </header>

      <aside class="panel" aria-label="历史对话">
        <button class="new-chat" id="newChat" type="button">新建对话</button>

        <section class="history">
          <div class="history-list" id="historyList">
            <a href="#" class="history-item" data-query="经营看板本月关键指标解读" data-history-answer-id="ops-dashboard">经营看板本月关键指标解读</a>
            <a href="#" class="history-item" data-query="应收账款逾期风险分析" data-history-answer-id="ar-risk">应收账款逾期风险分析</a>
            <a href="#" class="history-item" data-query="采购交付准时率波动原因" data-history-answer-id="purchase-otd">采购交付准时率波动原因</a>
            <a href="#" class="history-item" data-query="生产良率异常批次追踪" data-history-answer-id="yield-trace">生产良率异常批次追踪</a>
            <a href="#" class="history-item" data-query="库存周转天数结构拆解" data-history-answer-id="stock-turnover">库存周转天数结构拆解</a>
            <a href="#" class="history-item" data-query="合同履约进度风险预警" data-history-answer-id="contract-risk">合同履约进度风险预警</a>
            <a href="#" class="history-item" data-query="售后工单处理效率对比" data-history-answer-id="ticket-efficiency">售后工单处理效率对比</a>
            <a href="#" class="history-item" data-query="部门人效投入产出分析" data-history-answer-id="people-efficiency">部门人效投入产出分析</a>
          </div>
        </section>
      </aside>

      <main class="main" id="main">
        <section class="greeting" id="greeting" aria-label="欢迎"></section>

        <section class="chat-view" id="chatView" aria-live="polite"></section>

        <section class="workspace" id="workspace" aria-label="对话区">
          <div class="search-panel" id="searchPanel" hidden>
            <div class="search-results" id="searchResults"></div>
          </div>

          <form class="composer" id="composerForm">
            <textarea id="questionInput" aria-label="输入问题" placeholder="输入问题或关键词"></textarea>
            <div class="composer-footer">
              <div class="mode-group">
                <button type="button" class="pill active-pill">分析</button>
                <button type="button" class="pill">记录</button>
              </div>
              <div class="action-group">
                <button type="button" class="icon-button" title="附件" aria-label="附件">附件</button>
                <button type="button" class="icon-button" title="语音" aria-label="语音">语音</button>
                <button type="submit" class="send" id="sendButton" title="发送" aria-label="发送">发送</button>
              </div>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script>
      window.aiDemoStorageKey = "bDataConversationHistory";
      window.aiDemoShowMetricCards = false;
      window.aiDemoQuestionTitle = "更多问题";
      window.aiDemoHistoryIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16M7 4v15M17 4v15M4 18.5h16" /><path d="M9.5 9.5h5M9.5 13h5" /></svg>';
    </script>
    <script src="./content.js?v=20260727-bdata-8"></script>
    <script src="../script.js?v=20260727-bdata-8"></script>
  </body>
</html>
