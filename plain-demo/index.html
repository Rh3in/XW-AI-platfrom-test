<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能问数</title>
    <link rel="stylesheet" href="./styles.css?v=20260804-line-y-axis" />
  </head>
  <body>
    <div class="app">
      <header class="site-header">
        <strong>智能问数</strong>
      </header>

      <aside class="panel" aria-label="历史对话">
        <button class="new-chat" id="newChat" type="button">新建对话</button>

        <section class="history">
          <div class="history-list" id="historyList">
            <a href="#" class="history-item" data-query="经营异常企业按区域统计" data-history-answer-id="abnormal-region">经营异常企业按区域统计</a>
            <a href="#" class="history-item" data-query="证照即将到期企业提醒" data-history-answer-id="license-expiry">证照即将到期企业提醒</a>
            <a href="#" class="history-item" data-query="近一年法人变更企业统计" data-history-answer-id="legal-change">近一年法人变更企业统计</a>
            <a href="#" class="history-item" data-query="实缴资本为0企业清单" data-history-answer-id="paid-capital">实缴资本为0企业清单</a>
            <a href="#" class="history-item" data-query="参保人数区间分布" data-history-answer-id="insured-scale">参保人数区间分布</a>
            <a href="#" class="history-item" data-query="同地址注册企业数量排查" data-history-answer-id="address-cluster">同地址注册企业数量排查</a>
            <a href="#" class="history-item" data-query="企业联系电话缺失情况" data-history-answer-id="contact-missing">企业联系电话缺失情况</a>
            <a href="#" class="history-item" data-query="已注销企业行业分布" data-history-answer-id="cancelled-industry">已注销企业行业分布</a>
          </div>
        </section>
      </aside>

      <main class="main" id="main">
        <section class="greeting" id="greeting" aria-label="欢迎"></section>

        <section class="chat-view" id="chatView" aria-live="polite"></section>

        <section class="workspace" id="workspace" aria-label="对话区">
          <div class="search-panel" id="searchPanel" hidden>
            <div class="search-results" id="searchResults"></div>
          </div>

          <form class="composer" id="composerForm">
            <textarea id="questionInput" aria-label="输入问题" placeholder="输入问题或关键词"></textarea>
            <div class="composer-footer">
              <div class="mode-group">
                <button type="button" class="pill active-pill">分析</button>
                <button type="button" class="pill">记录</button>
              </div>
              <div class="action-group">
                <button type="button" class="icon-button" title="附件" aria-label="附件">附件</button>
                <button type="button" class="icon-button" title="语音" aria-label="语音">语音</button>
                <button type="submit" class="send" id="sendButton" title="发送" aria-label="发送">发送</button>
              </div>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script>
      window.aiDemoStorageKey = "bDataBusinessCheckHistoryV2";
      window.aiDemoShowMetricCards = false;
      window.aiDemoQuestionTitle = "更多问题";
      window.aiDemoStaticGuessCharts = true;
      window.aiDemoAnswerMetaPlacement = "bottom";
      window.aiDemoCompactActions = true;
      window.aiDemoHistoryIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16M7 4v15M17 4v15M4 18.5h16" /><path d="M9.5 9.5h5M9.5 13h5" /></svg>';
    </script>
    <script src="./content.js?v=20260804-value-spread"></script>
    <script src="../script.js?v=20260804-line-y-axis"></script>
  </body>
</html>
